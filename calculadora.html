<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="calculadora.css">
</head>

<body>

<header>

    <div class="calculator">
    <input type="text" id="result"
    readonly >
    </div>

</header>

<main>

    <div class="buttons">

         <!--primeira linha -->

        <button class="clear">C</button>
        <button class="backspace">⌫</button>
        <button class="percent">%</button>
        <button class="division">/</button>

        <!--segunda linha --->

        <button class="number 7">7</button>
        <button class="number 8">8</button>
        <button class="number 9">9</button>
         <button class="multiplication">*</button>
         
         <!--terceira linha -->
         
         <button class="number 4">4</button>
         <button class="number 5">5</button>
         <button class="number 6">6</button>
         <button class="subtraction">-</button>

        <!--quarta linha -->

        <button class="number 1">1</button>
        <button class="number 2">2</button>
        <button class="number 3">3</button>
         <button class="addition">+</button>

        <!--quinta linha -->
        
        <button class="number 0">0</button>
        <button class="virgula">,</button>
         <button class="equals">=</button>
</main>
    <script src="script.js"></script>
</body>
</html>
